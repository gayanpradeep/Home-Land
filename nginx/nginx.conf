user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $host [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile       on;
  tcp_nopush     on;
  tcp_nodelay    on;
  keepalive_timeout 65;
  server_tokens  off;
  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml application/xml+rss text/javascript image/svg+xml;

  # Shared rate-limit zone every site can opt into (see snippets/rate-limit.conf).
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;

  # One file per app/site. Adding a new app later = add one file here,
  # nothing else in this file changes.
  include /etc/nginx/conf.d/*.conf;
}
