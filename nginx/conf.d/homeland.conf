# Home Land app. No domain yet, so this answers on the server's bare IP
# (default_server). Once a domain is pointed here: change server_name to the
# real domain, drop default_server from this file, and see
# conf.d/_app-template.conf.disabled for adding HTTPS via certbot.

upstream homeland_app {
  least_conn;
  keepalive 32;

  server home-land-1:8080 max_fails=3 fail_timeout=10s;
  server home-land-2:8080 max_fails=3 fail_timeout=10s;
}

server {
  listen 80 default_server;
  server_name _;

  limit_req zone=per_ip burst=20 nodelay;

  include /etc/nginx/snippets/security-headers.conf;

  location / {
    proxy_pass http://homeland_app;
    include /etc/nginx/snippets/proxy-params.conf;
  }
}
